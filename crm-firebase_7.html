<style>

  --navy:   #1B3A6B;

:root[data-theme="dark"] {
  --bg:     #0F172A;

  --text:   #E2E8F0;
  --muted:  #94A3B8;

}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;font-size:14px;background:var(--bg);color:var(--text);display:flex;min-height:100vh;line-height:1.5}

/* ── SIDEBAR ── */
#sidebar{width:var(--side-w);background:#12264A;color:#fff;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:200}
.side-logo{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.side-logo h2{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;letter-spacing:.5px;color:#F59E0B;text-transform:uppercase;line-height:1}
.side-logo small{display:block;font-size:11px;color:rgba(255,255,255,.45);margin-top:3px;letter-spacing:.4px;text-transform:uppercase}
#sidebar nav{flex:1;padding:8px 0;overflow-y:auto}
.nav-a{display:flex;align-items:center;gap:10px;padding:11px 18px;color:rgba(255,255,255,.65);text-decoration:none;font-size:13.5px;cursor:pointer;transition:background .12s,color .12s;border-left:3px solid transparent}
.nav-a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-a.active{background:rgba(255,255,255,.1);color:#fff;border-left-color:#F59E0B}
.nav-a .ico{width:18px;text-align:center;font-size:15px;flex-shrink:0}
.nav-label{font-family:'Barlow Condensed',sans-serif;font-size:14.5px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.side-foot{padding:12px 18px;font-size:10px;color:rgba(255,255,255,.25);border-top:1px solid rgba(255,255,255,.06);letter-spacing:.3px;text-transform:uppercase}

/* ── MAIN ── */
#main{margin-left:var(--side-w);flex:1;display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
#topbar{background:var(--surf);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:12px}
#topbar h1{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.5px}
#content{padding:22px 24px;flex:1}

/* ── CARDS ── */
.card{background:var(--surf);border:1px solid var(--border);border-radius:8px}
.card-pad{padding:18px 20px}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:12px}

/* ── KPI GRID ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--surf);border:1px solid var(--border);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:4px}
.kpi-lbl{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.kpi-val{font-size:30px;font-weight:700;font-family:'Barlow Condensed',sans-serif;color:var(--navy);line-height:1}
.kpi-sub{font-size:11px;color:var(--muted)}

/* ── TABLES ── */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 12px;background:var(--bg);border-bottom:2px solid var(--border);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg)}

/* ── BADGES ── */
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap;font-family:'Barlow Condensed',sans-serif;letter-spacing:.3px;font-size:12px}
.b-gray{background:#E2E8F0;color:#475569}
.b-blue{background:#DBEAFE;color:#1D4ED8}
.b-green{background:#DCFCE7;color:#15803D}
.b-yellow{background:#FEF9C3;color:#A16207}
.b-red{background:#FEE2E2;color:#B91C1C}
.b-orange{background:#FFEDD5;color:#C2410C}
.b-purple{background:#EDE9FE;color:#6D28D9}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .b-gray{background:#334155;color:#94A3B8}
  :root:not([data-theme="light"]) .b-blue{background:#1E3A5F;color:#93C5FD}
  :root:not([data-theme="light"]) .b-green{background:#14532D;color:#86EFAC}
  :root:not([data-theme="light"]) .b-yellow{background:#713F12;color:#FDE68A}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .12s;font-family:inherit;white-space:nowrap}
.btn-primary{background:var(--navy);color:#fff}.btn-primary:hover{background:var(--navy2)}
.btn-amber{background:var(--amber);color:#fff}.btn-amber:hover{background:var(--amber2)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}.btn-outline:hover{border-color:var(--navy);color:var(--navy)}
.btn-ghost{background:transparent;color:var(--muted);border:none}.btn-ghost:hover{color:var(--text);background:var(--bg)}
.btn-danger{background:var(--err);color:#fff}.btn-danger:hover{background:#b91c1c}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-xs{padding:3px 7px;font-size:11px}

/* ── FORMS ── */
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.fg input,.fg select,.fg textarea{padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;color:var(--text);background:var(--surf);font-family:inherit;transition:border-color .12s}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--navy)}
.fg textarea{min-height:72px;resize:vertical}
.fg select option{background:var(--surf)}
.fg-row{display:grid;gap:12px}
.c2{grid-template-columns:1fr 1fr}
.c3{grid-template-columns:1fr 1fr 1fr}

/* ── SECTION ── */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.sec-title{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.4px}

/* ── TOOLBAR ── */
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}

.mbody{padding:22px;overflow-y:auto;flex:1}
.mfoot{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
.x-btn{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1;padding:2px 4px}.x-btn:hover{color:var(--text)}

/* ── TABS ── */
.tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:18px;gap:0}
.tab{padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer;background:none;border:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;font-family:inherit;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}

/* ── EMPTY ── */

/* ── PRINT ── */
@media print {

/* ── RESPONSIVE ── */
@media (max-width:600px){

/* ── NR CODE ── */
.nr-code{font-family:'JetBrains Mono','Courier New',monospace;font-weight:600;font-size:13px;color:var(--navy)}
/* ── LOGO SIDEBAR ── */
.side-logo-img{max-height:52px;max-width:170px;object-fit:contain;display:block;margin-bottom:6px;border-radius:4px}
/* ── SAIR BTN ── */
.nav-sair{display:flex;align-items:center;gap:10px;padding:11px 18px;color:rgba(255,100,100,.75);text-decoration:none;font-size:13.5px;cursor:pointer;transition:background .12s,color .12s;border-left:3px solid transparent;border-top:1px solid rgba(255,255,255,.08);margin-top:4px}
.nav-sair:hover{background:rgba(255,80,80,.1);color:#fc8080}
.nav-sair .ico{width:18px;text-align:center;font-size:15px;flex-shrink:0}
/* ── REPORT BTNS ── */
.rep-card{background:var(--surf);border:1px solid var(--border);border-radius:8px;padding:22px 24px;display:flex;flex-direction:column;gap:12px}
.rep-card h3{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--navy);margin-bottom:4px}
.rep-card p{font-size:12px;color:var(--muted);margin-bottom:4px}
</style>

<script>
// ═══════════════════════════════════════════════
// FIREBASE CONFIG — Preencha com os dados do seu projeto Firebase
// ═══════════════════════════════════════════════
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyA_3GabFk-goKDCa7A7d9zBkcjhhPk-qcw",
  authDomain:        "crm-ff26.firebaseapp.com",
  projectId:         "crm-ff26",
  storageBucket:     "crm-ff26.firebasestorage.app",
  messagingSenderId: "842236812338",
  appId:             "1:842236812338:web:91426853abba38cf5a302b"
};

// DATA LAYER — Firebase Firestore (multi-conta, multi-computador)
// ═══════════════════════════════════════════════
const DEFAULT_CFG = {
  razaoSocial:'FF LOCAÇÃO E COMÉRCIO DE EQUIPAMENTOS LTDA',
  cnpj:'31.963.150/0001-24', ie:'79.731.706',
  endereco:'Rua da Soja, 93 / 93A', bairro:'Penha Circular',
  cidade:'Rio de Janeiro', cep:'20.931-670', uf:'RJ',
  nomeExibicao:'FF LOGÍSTICA',
  resp1Nome:'Paulo Confar', resp1Tel:'(21) 99923-6517', resp1Email:'pauloconfar@fflogistica.com.br',
  resp2Nome:'Maurício Macêdo', resp2Tel:'(21) 96942-1296', resp2Email:'mauricio@fflogistica.com.br',
  resp3Nome:'Danielle Mattos', resp3Tel:'(21) 3882-3943', resp3Email:'comercial1@fflogistica.com.br',
  series:{ locacao:1005, vendas:2000, venda_ativo:3500, compra:5500, servico:6500 }
};

const STATE = { clientes:[], visitas:[], propostas:[], cfg:null, _db:null };

const LS = {
  g(k){ try{return JSON.parse(localStorage.getItem('crm_'+k)||'null')}catch{return null} },
  s(k,v){ try{localStorage.setItem('crm_'+k,JSON.stringify(v))}catch{} }
};

function _dbSetColl(collName, newArr, oldArr){
  if(!STATE._db){ LS.s(collName, newArr); return; }
  const coll=STATE._db.collection(collName);
  const oldMap=new Map((oldArr||[]).map(x=>[x.id,x]));
  const newMap=new Map(newArr.map(x=>[x.id,x]));
  const batch=STATE._db.batch();
  for(const [id] of oldMap) if(!newMap.has(id)) batch.delete(coll.doc(id));
  for(const [id,item] of newMap){
    const old=oldMap.get(id);
    if(!old||JSON.stringify(old)!==JSON.stringify(item)) batch.set(coll.doc(id),item);
  }
  batch.commit().catch(e=>console.warn('DB write error:',e));
}

const STORE = {
  clientes(){ return STATE.clientes },
  setClientes(v){ const o=STATE.clientes; STATE.clientes=v; _dbSetColl('clientes',v,o); },
  visitas(){ return STATE.visitas },
  setVisitas(v){ const o=STATE.visitas; STATE.visitas=v; _dbSetColl('visitas',v,o); },
  propostas(){ return STATE.propostas },
  setPropostas(v){ const o=STATE.propostas; STATE.propostas=v; _dbSetColl('propostas',v,o); },
  cfg(){ return STATE.cfg||DEFAULT_CFG },
  setCfg(v){
    STATE.cfg=v;
    if(STATE._db) STATE._db.collection('cfg').doc('main').set(v).catch(()=>{});
    else LS.s('cfg',v);
  },
  nextNr(cat){
    const c={...(STATE.cfg||DEFAULT_CFG)};
    if(!c.series) c.series={locacao:1005,vendas:2000,venda_ativo:3500,compra:5500,servico:6500};
    c.series={...c.series};
    c.series[cat]=(c.series[cat]||1000)+1;
    this.setCfg(c);
    return c.series[cat];
  }
};

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2) }
function today(){ return new Date().toISOString().slice(0,10) }
function fmtD(d){ if(!d)return''; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('pt-BR') }
function fmtM(v){ return (parseFloat(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}) }
function now(){ const d=new Date(); return d.toLocaleString('pt-BR') }

// ═══════════════════════════════════════════════
// CATEGORY CONFIG
// ═══════════════════════════════════════════════
const CATS = {
  locacao:     { label:'Locação',                    cls:'b-blue',   prefix:'LOC' },
  vendas:      { label:'Vendas',                     cls:'b-green',  prefix:'VEN' },
  venda_ativo: { label:'Venda de Ativo',             cls:'b-purple', prefix:'VAT' },
  compra:      { label:'Compra de Equipamento',      cls:'b-orange', prefix:'COM' },
  servico:     { label:'Serviço — Equip. Cliente',   cls:'b-gray',   prefix:'SVC' },
};

const STATUS = {
  rascunho:   { label:'Rascunho',    cls:'b-gray' },
  enviada:    { label:'Enviada',     cls:'b-blue' },
  em_revisao: { label:'Em Revisão', cls:'b-yellow' },
  aprovada:   { label:'Aprovada',   cls:'b-green' },
  perdida:    { label:'Perdida',    cls:'b-red' },
};

function catBadge(c){ const x=CATS[c]||{label:c,cls:'b-gray'}; return `<span class="badge ${x.cls}">${x.label}</span>` }
function stBadge(s){ const x=STATUS[s]||{label:s,cls:'b-gray'}; return `<span class="badge ${x.cls}">${x.label}</span>` }
function nrFmt(p){ return `${p.numero}/${new Date(p.dataCriacao||today()).getFullYear()}` }

// ═══════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════
let PAGE='dashboard';
const TITLES={dashboard:'Dashboard',clientes:'Clientes',visitas:'Visitas / Prospecções',propostas:'Propostas',relatorios:'Relatórios Excel',config:'Configurações'};
const RENDERS={dashboard:renderDash,clientes:renderClientes,visitas:renderVisitas,propostas:renderPropostas,relatorios:renderRelatorios,config:renderConfig};

function go(page){
  PAGE=page;
  document.querySelectorAll('.nav-a').forEach(a=>a.classList.toggle('active',a.dataset.page===page));
  document.getElementById('page-title').textContent=TITLES[page]||page;
  (RENDERS[page]||function(){})();
}

document.getElementById('nav').addEventListener('click',e=>{
  const a=e.target.closest('.nav-a');
  if(a&&a.dataset.page) go(a.dataset.page);
});

// ═══════════════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════════════
function renderDash(){
  const props=STORE.propostas(), clis=STORE.clientes(), visits=STORE.visitas();
  const yr=new Date().getFullYear(), mo=new Date().getMonth();
  const propYr=props.filter(p=>new Date(p.dataCriacao||'2026').getFullYear()===yr);
  const propMo=propYr.filter(p=>new Date(p.dataCriacao||'2026').getMonth()===mo);
  const aprov=propYr.filter(p=>p.status==='aprovada');
  const env=propYr.filter(p=>p.status!=='rascunho');
  const tc=env.length?Math.round(aprov.length/env.length*100):0;
  const pipe=props.filter(p=>['enviada','em_revisao'].includes(p.status)).reduce((s,p)=>s+(parseFloat(p.valorTotal)||0),0);
  const visMo=visits.filter(v=>{const d=new Date(v.data||'2026');return d.getFullYear()===yr&&d.getMonth()===mo});

  // category breakdown
  const bycat={};
  propYr.forEach(p=>{const c=p.cat||'locacao';if(!bycat[c])bycat[c]={t:0,a:0};bycat[c].t++;if(p.status==='aprovada')bycat[c].a++});
  const catRows=Object.entries(bycat).map(([c,v])=>`
    <tr><td>${catBadge(c)}</td><td style="text-align:center">${v.t}</td><td style="text-align:center">${v.a}</td>
    <td style="text-align:center"><strong>${v.t?Math.round(v.a/v.t*100):0}%</strong></td></tr>`).join('');

  // recent proposals
  const rec=[...props].sort((a,b)=>b.dataCriacao>a.dataCriacao?1:-1).slice(0,8);
  const recRows=rec.map(p=>{
    const cli=clis.find(c=>c.id===p.clienteId);
    return `<tr>
      <td><span class="nr-code">${nrFmt(p)}</span>${p.revisao>0?`<span class="badge b-yellow" style="font-size:10px;margin-left:4px">Rev.${p.revisao}</span>`:''}</td>
      <td>${cli?cli.razaoSocial:'-'}</td>
      <td>${catBadge(p.cat||'locacao')}</td>
      <td>${stBadge(p.status||'rascunho')}</td>
      <td style="text-align:right"><b>${fmtM(p.valorTotal)}</b></td>
      <td><button class="btn btn-outline btn-xs" onclick="viewProposta('${p.id}')">Ver</button></td>
    </tr>`;
  }).join('');

  document.getElementById('content').innerHTML=`
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-lbl">Clientes</div><div class="kpi-val">${clis.length}</div><div class="kpi-sub">cadastrados</div></div>
      <div class="kpi"><div class="kpi-lbl">Visitas — mês</div><div class="kpi-val">${visMo.length}</div><div class="kpi-sub">${new Date().toLocaleString('pt-BR',{month:'long'})}</div></div>
      <div class="kpi"><div class="kpi-lbl">Propostas — ano</div><div class="kpi-val">${propYr.length}</div><div class="kpi-sub">${propMo.length} neste mês</div></div>
      <div class="kpi"><div class="kpi-lbl">Taxa de Conversão</div><div class="kpi-val" style="color:${tc>=30?'var(--ok)':'var(--warn)'}">${tc}%</div><div class="kpi-sub">${aprov.length}/${env.length} enviadas</div></div>
      <div class="kpi"><div class="kpi-lbl">Pipeline</div><div class="kpi-val" style="font-size:20px;padding-top:6px">${fmtM(pipe)}</div><div class="kpi-sub">em aberto</div></div>
      <div class="kpi"><div class="kpi-lbl">Aprovadas ${yr}</div><div class="kpi-val" style="color:var(--ok)">${aprov.length}</div><div class="kpi-sub">propostas ganhas</div></div>
    </div>

    <div style="display:grid;grid-template-columns:280px 1fr;gap:16px">
      <div class="card card-pad">
        <div class="card-title">Por Categoria — ${yr}</div>
        ${catRows?`<table><thead><tr><th>Categoria</th><th style="text-align:center">Total</th><th style="text-align:center">Aprov.</th><th style="text-align:center">Conv.</th></tr></thead><tbody>${catRows}</tbody></table>`
        :'<div class="empty"><div class="ei">📊</div><p>Sem dados ainda</p></div>'}
      </div>
      <div class="card card-pad">
        <div class="card-title">Propostas Recentes</div>
        ${recRows?`<div class="tbl-wrap"><table><thead><tr><th>Nº</th><th>Cliente</th><th>Tipo</th><th>Status</th><th style="text-align:right">Valor</th><th></th></tr></thead><tbody>${recRows}</tbody></table></div>`
        :'<div class="empty"><div class="ei">📄</div><p>Sem propostas ainda</p></div>'}
      </div>
    </div>
  `;
}

    </div>

    </div>
    <div class="fg-row c2">
      <div class="fg"><label>Insc. Estadual</label><input id="c-ie" value="${v('ie')}"></div>
      <div class="fg"><label>Insc. Municipal</label><input id="c-im" value="${v('im')}"></div>
    </div>
    <div class="fg-row c2">
      <div class="fg"><label>Telefone</label><input id="c-tel" value="${v('telefone')}"></div>

          <option value="">— Selecionar —</option>
          ${['Logística','Varejo','Indústria','Construção Civil','Frigorífico / Câmara Fria','Atacado / Distribuição','Porto / Terminal','Agronegócio','Saúde / Farmácia','Outro'].map(s=>`<option value="${s}" ${v('segmento')===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="fg"><label>Endereço</label><input id="c-end" value="${v('endereco')}"></div>
    <div class="fg-row c4">
      <div class="fg"><label>Bairro</label><input id="c-bairro" value="${v('bairro')}"></div>
      <div class="fg"><label>Cidade</label><input id="c-cidade" value="${v('cidade')}"></div>

    </div>
    <div class="fg"><label>Observações</label><textarea id="c-obs">${v('observacoes')}</textarea></div>

    const data={

      razaoSocial:g('c-razao').toUpperCase(),

    STORE.setClientes(clis);
    closeModal(); renderClientes();
  });
}

function delCliente(id){
  if(!confirm('Excluir este cliente?')) return;
  STORE.setClientes(STORE.clientes().filter(c=>c.id!==id));
  renderClientes();
}

function novaPropostaFor(cliId){
  go('propostas');
  setTimeout(()=>editProposta(null,cliId),60);
}

          <option value="">—</option>
          <option value="locacao" ${sel('interesse','locacao')}>Locação</option>
          <option value="vendas" ${sel('interesse','vendas')}>Venda</option>
          <option value="servico" ${sel('interesse','servico')}>Manutenção / Serviço</option>

function filterProps(){

  const fs=document.getElementById('f-st')?.value||'';
  const clis=STORE.clientes();
  let pp=STORE.propostas();
  if(q) pp=pp.filter(p=>{const c=clis.find(x=>x.id===p.clienteId);return (nrFmt(p)).includes(q)||(c?.razaoSocial||'').toLowerCase().includes(q)||(p.equipDescr||'').toLowerCase().includes(q)});
  if(fc) pp=pp.filter(p=>p.cat===fc);
  if(fs) pp=pp.filter(p=>p.status===fs);
  pp.sort((a,b)=>b.dataCriacao>a.dataCriacao?1:-1);
  const cliMap=Object.fromEntries(clis.map(c=>[c.id,c]));
  const rows=pp.map(p=>{
    const c=cliMap[p.clienteId];
    return `<tr>
      <td><span class="nr-code">${nrFmt(p)}</span>${p.revisao>0?` <span class="badge b-yellow" style="font-size:10px">Rev.${p.revisao}</span>`:''}</td>
      <td>${fmtD(p.dataCriacao)}</td>
      <td style="max-width:200px">${c?c.razaoSocial:'-'}</td>

      <td style="text-align:right"><b>${fmtM(p.valorTotal)}</b></td>
      <td><div class="acts">
        <button class="btn btn-outline btn-xs" onclick="viewProposta('${p.id}')">👁️</button>
        <button class="btn btn-outline btn-xs" onclick="editProposta('${p.id}')">✏️</button>
        <button class="btn btn-outline btn-xs" onclick="dupProposta('${p.id}')">📋</button>

  const tb=document.querySelector('#tbl-props tbody');
  if(tb) tb.innerHTML=rows||'<tr><td colspan="8" style="text-align:center;padding:24px;color:var(--muted)">Sem resultados.</td></tr>';
}

// ═══════════════════════════════════════════════
// PROPOSTAS — FORM
// ═══════════════════════════════════════════════
function editProposta(id, preCli){
  const ex=id?STORE.propostas().find(p=>p.id===id):null;
  const clis=STORE.clientes();
  const v=k=>ex?.[k]??'';
  const sel=(f,val)=>v(f)===val?'selected':'';
  const cliOpts=clis.map(c=>`<option value="${c.id}" ${(v('clienteId')||preCli)===c.id?'selected':''}>${c.razaoSocial}</option>`).join('');
  const catOpts=Object.entries(CATS).map(([k,c])=>`<option value="${k}" ${sel('cat',k)||(!ex&&k==='locacao'?'selected':'')}>${c.label}</option>`).join('');
  const stOpts=Object.entries(STATUS).map(([k,s])=>`<option value="${k}" ${sel('status',k)||(!ex&&k==='rascunho'?'selected':'')}>${s.label}</option>`).join('');

  const body=`
  <div class="tabs">
    <button class="tab on" onclick="swTab('t-geral',this)">1. Geral</button>
    <button class="tab" onclick="swTab('t-cliente',this)">2. Cliente</button>
    <button class="tab" onclick="swTab('t-equip',this)">3. Equipamento</button>
    <button class="tab" onclick="swTab('t-comercial',this)">4. Condições</button>
  </div>

  <!-- TAB 1 -->
  <div id="t-geral">
    <div style="display:grid;gap:12px">
      <div class="fg-row c3">
        <div class="fg"><label>Categoria *</label><select id="p-cat">${catOpts}</select></div>
        <div class="fg"><label>Status</label><select id="p-status">${stOpts}</select></div>
        <div class="fg"><label>Nº Revisão</label><input id="p-rev" type="number" min="0" value="${v('revisao')||0}"></div>
      </div>
      <div class="fg-row c3">
        <div class="fg"><label>Data de Emissão</label><input id="p-data" type="date" value="${v('dataCriacao')||today()}"></div>
        <div class="fg"><label>Validade (dias)</label><input id="p-val" type="number" value="${v('validadeDias')||10}"></div>
        <div class="fg"><label>Vendedor Responsável</label>
          <select id="p-vendedor">
            <option value="">— Selecionar —</option>
            ${[1,2,3].map(n=>{const nm=STORE.cfg()['resp'+n+'Nome'];return nm?`<option value="${n}" ${v('vendedorIdx')==n?'selected':''}>${nm}</option>`:''}).join('')}
          </select>
        </div>
      </div>

      <!-- Revisões table -->
      <datalist id="dl-motivos-rev">
        <option value="Proposta Expirada">
        <option value="Preço">
        <option value="Condições de Pagamento">
        <option value="Alteração de Configuração">
      </datalist>
      <div class="sub-sec">
        <div class="sub-sec-title">📋 Histórico de Revisões</div>
        <div style="display:grid;gap:8px">
          ${['A','B','C','D'].map(r=>`
          <div class="fg-row c3" style="align-items:end">
            <div class="fg"><label>Rev. ${r} — Data</label><input id="p-rev${r}-d" type="date" value="${v('rev'+r+'Data')}"></div>
            <div class="fg" style="grid-column:span 2"><label>Motivo</label><input id="p-rev${r}-m" list="dl-motivos-rev" value="${v('rev'+r+'Motivo')}" placeholder="Motivo da revisão ${r}"></div>
          </div>`).join('')}
        </div>
      </div>

      <div class="fg"><label>Observações Internas (não aparecem na proposta)</label><textarea id="p-obs">${v('observacoes')}</textarea></div>
    </div>
  </div>

  <!-- TAB 2 -->
  <div id="t-cliente" style="display:none">
    <div style="display:grid;gap:12px">
      <div class="fg"><label>Cliente (Locatário) *</label>
        <select id="p-cli"><option value="">— Selecionar —</option>${cliOpts}</select>
      </div>
      <div class="fg"><label>Solicitante (contato)</label><input id="p-solicit" value="${v('solicitante')}" placeholder="Nome do contato no cliente"></div>
      <div class="sub-sec">
        <div class="sub-sec-title">📍 Local de Operação</div>
        <div style="display:grid;gap:10px">
          <div class="fg"><label>Empresa no local (se diferente)</label><input id="p-loc-emp" value="${v('localEmpresa')}"></div>
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;margin-top:2px">
            <input type="checkbox" id="p-loc-mesmo" ${!v('localEndereco')?'checked':''} onchange="toggleLocEnd(this)" style="width:16px;height:16px;cursor:pointer">
            <span style="font-weight:600;color:var(--navy)">Mesmo endereço Cartão CNPJ</span>
          </label>
          <div id="p-loc-end-wrap" style="${!v('localEndereco')?'display:none':''}">
            <div class="fg"><label>Endereço da Operação (se diferente)</label><input id="p-loc-end" value="${v('localEndereco')}" placeholder="Rua, nº, bairro, cidade — UF"></div>
          </div>
        </div>
      </div>
      <div class="sub-sec">
        <div class="sub-sec-title">⚙️ Informações da Operação</div>
        <div class="fg-row c3">
          <div class="fg"><label>Ambiente</label>
            <select id="p-amb">
              <option value="">— Selecionar —</option>
              <option value="Carga Seca" ${sel('ambiente','Carga Seca')}>Carga Seca</option>
              <option value="Câmara Fria" ${sel('ambiente','Câmara Fria')}>Câmara Fria</option>
              <option value="Externo/Pátio" ${sel('ambiente','Externo/Pátio')||sel('ambiente','Externo')}>Externo/Pátio</option>
            </select>
          </div>
          <div class="fg"><label>Turnos / dia</label>
            <select id="p-turnos">
              <option value="">— Selecionar —</option>
              <option value="1 Turno" ${sel('turnos','1 Turno')}>1 Turno (8h)</option>
              <option value="1 1/2 Turno (até 12 horas por dia)" ${sel('turnos','1 1/2 Turno (até 12 horas por dia)')}>1½ Turno (12h)</option>
              <option value="2 Turnos" ${sel('turnos','2 Turnos')}>2 Turnos (16h)</option>
              <option value="3 Turnos" ${sel('turnos','3 Turnos')}>3 Turnos (24h)</option>
            </select>
          </div>
          <div class="fg"><label>Operador</label>
            <select id="p-oper">
              <option value="">— Selecionar —</option>
              <option value="Por conta do LOCADOR" ${sel('operador','Por conta do LOCADOR')}>Por conta do LOCADOR</option>
              <option value="Por conta do LOCATÁRIO" ${sel('operador','Por conta do LOCATÁRIO')}>Por conta do LOCATÁRIO</option>
            </select>
          </div>
        </div>
        <div class="fg-row c2">
          <div class="fg"><label>Data Início (Previsão)</label><input id="p-inicio" type="date" value="${v('dataInicio')}"></div>
          <div class="fg"><label>Obs. início</label><input id="p-inicioObs" value="${v('dataInicioObs')}" placeholder="ex: À confirmar"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- TAB 3 -->
  <div id="t-equip" style="display:none">
    <div style="display:grid;gap:12px">
      <div class="sub-sec">
        <div class="sub-sec-title">🏗️ Equipamento Principal</div>
        <div class="fg"><label>Tipo de Equipamento</label>
            <select id="p-tipo-equip" onchange="toggleEquipFields(this.value)">
              <option value="">— Selecionar —</option>
              <option value="Empilhadeira Elétrica Retrátil" ${sel('tipoEquip','Empilhadeira Elétrica Retrátil')}>Empilhadeira Elétrica Retrátil</option>
              <option value="Empilhadeira Elétrica Contrabalançada" ${sel('tipoEquip','Empilhadeira Elétrica Contrabalançada')}>Emp. Elétrica Contrabalançada</option>
              <option value="Empilhadeira a Combustão GLP" ${sel('tipoEquip','Empilhadeira a Combustão GLP')}>Empilhadeira a Combustão GLP</option>
              <option value="Empilhadeira a Combustão Diesel" ${sel('tipoEquip','Empilhadeira a Combustão Diesel')}>Empilhadeira a Combustão Diesel</option>
              <option value="Transpaleteira Elétrica" ${sel('tipoEquip','Transpaleteira Elétrica')}>Transpaleteira Elétrica</option>
              <option value="Transpaleteira Manual" ${sel('tipoEquip','Transpaleteira Manual')}>Transpaleteira Manual</option>
              <option value="Patolada Elétrica" ${sel('tipoEquip','Patolada Elétrica')}>Patolada Elétrica</option>
              <option value="Niveladora de Doca" ${sel('tipoEquip','Niveladora de Doca')}>Niveladora de Doca</option>
              <option value="Porta Industrial" ${sel('tipoEquip','Porta Industrial')}>Porta Industrial</option>
            </select>
          </div>
        <div class="fg-row c3">
          <div class="fg"><label>Capacidade (kg)</label><input id="p-cap" type="number" value="${v('capacidadeKg')}"></div>
          <div class="fg"><label>Elevação máx. (mm)</label><input id="p-alt" type="number" value="${v('alturaMm')}"></div>
          <div class="fg"><label>Quantidade</label><input id="p-qtd" type="number" min="1" value="${v('quantidade')||1}"></div>
        </div>
      </div>

      <!-- CAMPOS ELÉTRICA -->
      <div id="sec-eletrica" style="${(()=>{const t=v('tipoEquip')||'';return (t.includes('Elétrica')||t.includes('Eletrica'))?'':'display:none'})()}">
        <div class="sub-sec">
          <div class="sub-sec-title">🔋 Baterias</div>
          <div class="fg-row c3">
            <div class="fg"><label>Quantidade</label><input id="p-bat-qtd" type="number" value="${v('batQtd')||1}"></div>
            <div class="fg"><label>Tensão (V)</label>
              <select id="p-bat-v">
                <option value="">—</option>
                <option value="24" ${v('batV')==24?'selected':''}>24 V</option>
                <option value="36" ${v('batV')==36?'selected':''}>36 V</option>
                <option value="48" ${v('batV')==48?'selected':''}>48 V</option>
              </select>
            </div>
            <div class="fg"><label>Capacidade (Ah)</label><input id="p-bat-ah" type="number" value="${v('batAh')}"></div>
          </div>
          <div class="fg-row c2">
            <div class="fg"><label>Tipo de bateria</label>
              <select id="p-bat-tipo">
                <option value="chumbo-ácido" ${sel('batTipo','chumbo-ácido')}>Chumbo-ácido (gel/líquida)</option>
                <option value="lítio" ${sel('batTipo','lítio')}>Lítio (Li-Ion)</option>
              </select>
            </div>
          </div>
        </div>

        <div class="sub-sec">
          <div class="sub-sec-title">⚡ Carregador de Bateria</div>
          <div class="fg-row c4">
            <div class="fg"><label>Quantidade</label><input id="p-car-qtd" type="number" value="${v('carQtd')||1}"></div>
            <div class="fg"><label>Tensão entrada (V)</label>
              <select id="p-car-v">
                <option value="">—</option>
                <option value="220" ${v('carV')==220?'selected':''}>220 V</option>
                <option value="380" ${v('carV')==380?'selected':''}>380 V</option>
                <option value="440" ${v('carV')==440?'selected':''}>440 V</option>
              </select>
            </div>
            <div class="fg"><label>Corrente (A)</label><input id="p-car-a" type="number" value="${v('carA')}"></div>
            <div class="fg"><label>Fase</label>
              <select id="p-car-fase">
                <option value="" ${!v('carFase')?'selected':''}>—</option>
                <option value="monofásico" ${sel('carFase','monofásico')}>Monofásico</option>
                <option value="trifásico" ${sel('carFase','trifásico')}>Trifásico</option>
              </select>
            </div>
          </div>
        </div>

        <div class="sub-sec">
          <div class="sub-sec-title">🛒 Carrinho de Baterias</div>
          <div class="fg-row c2">
            <div class="fg"><label>Nº de Posições</label>
              <select id="p-carrinho-pos">
                <option value="">—</option>
                <option value="1" ${sel('carrinhoPos','1')}>1 Posição</option>
                <option value="2" ${sel('carrinhoPos','2')}>2 Posições</option>
                <option value="3" ${sel('carrinhoPos','3')}>3 Posições</option>
              </select>
            </div>
            <div class="fg"><label>Quantidade</label><input id="p-carrinho-qtd" type="number" min="1" value="${v('carrinhoQtd')||1}"></div>
          </div>
        </div>
      </div>

      <!-- CAMPOS COMBUSTÃO -->
      <div id="sec-combustao" style="${(()=>{const t=v('tipoEquip')||'';return t.includes('Combustão')?'':'display:none'})()}">
        <div class="sub-sec">
          <div class="sub-sec-title">🔥 Combustão / GLP</div>
          <div class="fg-row c2">
            <div class="fg"><label>Nº de Botijão(ões)</label><input id="p-botijao" type="number" min="0" value="${v('botijoes')||''}"></div>
          </div>
          <div style="margin-top:12px;display:grid;gap:10px">
            <div class="fg-row c3" style="align-items:end">
              <div class="fg"><label>Alongador de Garfos</label>
                <select id="p-along-sn">
                  <option value="">—</option>
                  <option value="S" ${sel('alongadorSN','S')}>Sim</option>
                  <option value="N" ${sel('alongadorSN','N')}>Não</option>
                </select>
              </div>
              <div class="fg"><label>Tamanho (mm)</label>
                <input id="p-along-mm" type="number" placeholder="ex: 1800" value="${v('alongadorMm')}">
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="fg"><label>Acessórios / Itens adicionais</label>
        <textarea id="p-acess" placeholder="Um item por linha, ex:&#10;01 (um) Conjunto de acessórios para troca de bateria">${v('acessorios')}</textarea>
      </div>

      <!-- LÂMINA TÉCNICA -->
      <div class="sub-sec">
        <div class="sub-sec-title">📎 Lâmina Técnica</div>
        <div style="display:grid;gap:8px">
          <div class="fg">
            <label>Link da Lâmina (Google Drive ou qualquer URL)</label>
            <input id="p-lamina-url" value="${v('laminaUrl')||''}" placeholder="Cole aqui o link de compartilhamento do PDF">
          </div>
          <div class="fg">
            <label>Nome do arquivo (opcional)</label>
            <input id="p-lamina-nome" value="${v('laminaNome')||''}" placeholder="ex: Lamina_Retratil_Still_R70-16.pdf">
          </div>
          <div style="font-size:11px;color:var(--muted);padding:8px;background:var(--bg);border-radius:6px;line-height:1.6">
            💡 <b>Como obter o link:</b> Abra o Google Drive → clique com botão direito no PDF → <b>Compartilhar</b> → <b>Qualquer pessoa com o link</b> → <b>Copiar link</b> → cole acima.
          </div>
          ${v('laminaUrl')?`<a href="${v('laminaUrl')}" target="_blank" class="btn btn-outline btn-xs" style="width:fit-content">👁️ Ver lâmina atual</a>`:''}
        </div>
      </div>
    </div>
  </div>

  <!-- TAB 4 -->
  <div id="t-comercial" style="display:none">
    <div style="display:grid;gap:12px">
      <div class="sub-sec">
        <div class="sub-sec-title">💰 Condições Comerciais</div>
        <div class="fg-row c3">
          <div class="fg"><label>Período</label><input id="p-per" type="number" value="${v('periodo')}" placeholder="12"></div>
          <div class="fg"><label>Unidade</label>
            <select id="p-per-un">
              <option value="mês(es)" ${sel('periodoUn','mês(es)')}>Mês(es)</option>
              <option value="ano(s)" ${sel('periodoUn','ano(s)')}>Ano(s)</option>
              <option value="dia(s)" ${sel('periodoUn','dia(s)')}>Dia(s)</option>
            </select>
          </div>
          <div class="fg"><label>Frete</label>
            <select id="p-frete">
              <option value="FOB" ${sel('frete','FOB')}>FOB (por conta do cliente)</option>
              <option value="CIF" ${sel('frete','CIF')}>CIF (por conta da FF)</option>
            </select>
          </div>
        </div>
        <div class="fg-row c3">
          <div class="fg"><label>Valor Mensal (R$)</label><input id="p-vmen" type="number" step="0.01" value="${v('valorMensal')}" oninput="calcVTotal()"></div>
          <div class="fg"><label>Frete Entrega (R$)</label><input id="p-vfrete" type="number" step="0.01" value="${v('valorFrete')||0}"></div>
          <div class="fg"><label>Valor Total (R$)</label><input id="p-vtot" type="number" step="0.01" value="${v('valorTotal')}"></div>
        </div>
        <div class="fg-row c2">
          <div class="fg"><label>Obs. custo mensal</label><input id="p-custo-obs" value="${v('custoObs')}" placeholder="ex: bateria chumbo-ácido"></div>
        </div>
      </div>
      <div class="fg"><label>Forma de Pagamento</label>
        <textarea id="p-pgto">${v('formaPagamento')||'Pagamento todo dia 15 do mês, mediante a apresentação do boleto e Nota de locação.'}</textarea>
      </div>
      <div class="fg"><label>Prazo para Liberação dos Equipamentos</label>
        <input id="p-prazo" value="${v('prazoLiberacao')||'Em até 15 dias após assinatura do contrato.'}">
      </div>
      <div class="fg"><label>Documentos para Confirmação do Pedido</label>
        <textarea id="p-docs">${v('docsPedido')||'Ficha Cadastral, Última Alteração Contratual, Contrato de Locação nos casos onde o endereço de operação for diferente do Contrato Social.'}</textarea>
      </div>
    </div>
  </div>
  `;

  openModal(ex?`Editar Proposta ${nrFmt(ex)}`:'Nova Proposta', body, ()=>saveProposta(id,preCli), {xl:true});
  document.getElementById('p-per')?.addEventListener('input',calcVTotal);
}

function swTab(tid,btn){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  ['t-geral','t-cliente','t-equip','t-comercial'].forEach(t=>{
    const el=document.getElementById(t);
    if(el) el.style.display=t===tid?'':'none';
  });
}

function calcVTotal(){
  const men=parseFloat(document.getElementById('p-vmen')?.value)||0;
  const per=parseFloat(document.getElementById('p-per')?.value)||1;
  const el=document.getElementById('p-vtot');
  if(el&&men) el.value=(men*per).toFixed(2);
}

function saveProposta(id,preCli){
  const g=i=>(document.getElementById(i)?.value||'').trim();
  if(!g('p-cli')){ alert('Selecione o cliente'); return false; }

  const props=STORE.propostas();
  const ex=id?props.find(p=>p.id===id):null;
  const cat=g('p-cat')||'locacao';
  const nr=ex?.numero||STORE.nextNr(cat);

  // Build equipment summary
  const qtd=parseInt(g('p-qtd'))||1;
  const locMesmo=document.getElementById('p-loc-mesmo')?.checked;
  const parts=[g('p-tipo-equip'),parseInt(g('p-cap'))?g('p-cap')+' Kg':'',parseInt(g('p-alt'))?'elev. '+g('p-alt')+' mm':''].filter(Boolean);
  const equipDescr=`${qtd>1?qtd+'x ':''}${parts.join(' ')}`;

  const data={
    id:ex?.id||uid(),
    numero:nr, cat,
    dataCriacao:g('p-data')||today(),
    status:g('p-status')||'rascunho',
    revisao:parseInt(g('p-rev'))||0,
    validadeDias:parseInt(g('p-val'))||10,
    revAData:g('p-revA-d'), revAMotivo:g('p-revA-m'),
    revBData:g('p-revB-d'), revBMotivo:g('p-revB-m'),
    revCData:g('p-revC-d'), revCMotivo:g('p-revC-m'),
    revDData:g('p-revD-d'), revDMotivo:g('p-revD-m'),
    observacoes:g('p-obs'),
    clienteId:g('p-cli'),
    solicitante:g('p-solicit'),
    localEmpresa:g('p-loc-emp'),
    localEndereco:locMesmo?'':g('p-loc-end'),
    ambiente:g('p-amb'),
    turnos:g('p-turnos'),
    operador:g('p-oper'),
    dataInicio:g('p-inicio'),
    dataInicioObs:g('p-inicioObs'),
    tipoEquip:g('p-tipo-equip'),
    capacidadeKg:parseInt(g('p-cap'))||0,
    alturaMm:parseInt(g('p-alt'))||0,
    quantidade:qtd,
    vendedorIdx:parseInt(g('p-vendedor'))||0,
    batQtd:parseInt(g('p-bat-qtd'))||1,
    batV:parseInt(g('p-bat-v'))||0,
    batAh:parseInt(g('p-bat-ah'))||0,
    batTipo:g('p-bat-tipo'),
    carQtd:parseInt(g('p-car-qtd'))||1,
    carV:parseInt(g('p-car-v'))||0,
    carA:parseInt(g('p-car-a'))||0,
    carFase:g('p-car-fase'),
    carrinhoPos:g('p-carrinho-pos'),
    carrinhoQtd:parseInt(g('p-carrinho-qtd'))||1,
    botijoes:parseInt(g('p-botijao'))||0,
    alongadorSN:g('p-along-sn'),
    alongadorMm:parseInt(g('p-along-mm'))||0,
    acessorios:g('p-acess'),
    laminaUrl:g('p-lamina-url')||(ex?.laminaUrl||''),
    laminaNome:g('p-lamina-nome')||(ex?.laminaNome||''),
    periodo:g('p-per'),
    periodoUn:g('p-per-un'),
    valorMensal:parseFloat(g('p-vmen'))||0,
    valorFrete:parseFloat(g('p-vfrete'))||0,
    valorTotal:parseFloat(g('p-vtot'))||0,
    custoObs:g('p-custo-obs'),
    formaPagamento:g('p-pgto'),
    frete:g('p-frete'),
    prazoLiberacao:g('p-prazo'),
    docsPedido:g('p-docs'),
    equipDescr
  };

  if(ex){ const i=props.findIndex(p=>p.id===id); props[i]=data; }
  else props.push(data);
  STORE.setPropostas(props);
  closeModal(); renderPropostas();
}

function delProposta(id){
  if(!confirm('Excluir esta proposta?')) return;
  STORE.setPropostas(STORE.propostas().filter(p=>p.id!==id));
  renderPropostas();
}

function dupProposta(id){
  const orig=STORE.propostas().find(p=>p.id===id);
  if(!orig) return;
  const cat=orig.cat||'locacao';
  const nova={...orig,id:uid(),numero:STORE.nextNr(cat),dataCriacao:today(),status:'rascunho',revisao:0,
    revAData:'',revAMotivo:'',revBData:'',revBMotivo:'',revCData:'',revCMotivo:'',revDData:'',revDMotivo:''};
  const pp=STORE.propostas(); pp.push(nova); STORE.setPropostas(pp);
  renderPropostas();
  alert(`Proposta duplicada como ${nrFmt(nova)}`);
}

// PROPOSTA — VIEW / PRINT
// ═══════════════════════════════════════════════
function viewProposta(id){
  const p=STORE.propostas().find(x=>x.id===id);
  if(!p) return;

function enviarEmail(id){
  const d=window._propData?.[id]; if(!d)return;
  const {p,cfg,cli}=d;
  const nr=nrFmt(p);
  const cat=(CATS[p.cat||'locacao']||CATS.locacao).label;
  const dest=cli.email||'';
  const assunto=`Proposta ${nr} — ${cat} — FF Logística`;
  const corpo=`Prezado(a) ${cli.solicitante||p.solicitante||'cliente'},\n\nSegue em anexo a Proposta Comercial Nº ${nr} referente a ${cat.toLowerCase()}.\n\nQualquer dúvida, estamos à disposição.\n\nAtenciosamente,\n${cfg.nomeExibicao||'FF Logística'}${cfg['resp'+p.vendedorIdx+'Tel']?'\nTel: '+cfg['resp'+p.vendedorIdx+'Tel']:''}`;
  const mailtoUrl=`mailto:${dest}?subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(corpo)}`;
  const html=`
    <div style="display:grid;gap:14px">
      <div style="background:var(--bg);border-radius:6px;padding:12px;font-size:12px;display:grid;gap:6px">
        <div><b>Para:</b> ${dest||'<em style="color:var(--muted)">E-mail não cadastrado</em>'}</div>
        <div><b>Assunto:</b> ${assunto}</div>
      </div>
      <div class="fg"><label>Mensagem</label>
        <textarea id="email-corpo" style="min-height:160px;font-size:12px;font-family:monospace" readonly>${corpo}</textarea>
      </div>
      <div style="background:#EFF6FF;border:1px solid #BFDBFE;border-radius:6px;padding:10px 12px;font-size:12px;color:#1E40AF;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span>📎 Para anexar a proposta, baixe o PDF primeiro:</span>
        <button class="btn btn-sm" style="background:#DC2626;color:#fff;border:none" onclick="gerarPDF('${id}')">📥 Baixar PDF</button>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-outline btn-sm" onclick="navigator.clipboard.writeText(document.getElementById('email-corpo').value).then(()=>alert('Mensagem copiada!'))">📋 Copiar mensagem</button>
        <button class="btn btn-outline btn-sm" onclick="navigator.clipboard.writeText('${dest.replace(/'/g,"\\'")}').then(()=>alert('E-mail copiado!'))">📧 Copiar e-mail</button>
        <a href="${mailtoUrl}" class="btn btn-primary btn-sm" style="text-decoration:none" target="_blank">✉️ Abrir cliente de e-mail</a>
      </div>
      <p style="font-size:11px;color:var(--muted)">💡 Baixe o PDF → abra o Outlook/Gmail → anexe o arquivo → envie.</p>
    </div>`;
  openModal('Enviar por E-mail', html, null, {noSave:true});
}

function enviarWhatsApp(id){
  const d=window._propData?.[id]; if(!d)return;
  const {p,cfg,cli}=d;
  const nr=nrFmt(p);
  const cat=(CATS[p.cat||'locacao']||CATS.locacao).label;
  const rawTel=(cli.telefone||'').replace(/\D/g,'');
  const tel=rawTel.startsWith('55')?rawTel:'55'+rawTel;
  const contato=cli.solicitante||p.solicitante||'';
  const msg=`Prezado(a) ${contato||'cliente'},\n\nSegue em anexo a Proposta Comercial Nº *${nr}* referente a ${cat.toLowerCase()}.\n\nQualquer dúvida, estamos à disposição.\n\nAtenciosamente,\n${cfg.nomeExibicao||'FF Logística'}`;
  const waUrl=`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`;
  const html=`
    <div style="display:grid;gap:14px">
      <div style="background:var(--bg);border-radius:6px;padding:12px;font-size:12px;display:grid;gap:6px">
        <div><b>Para:</b> ${cli.razaoSocial}${contato?' — '+contato:''}</div>
        <div><b>Telefone:</b> ${cli.telefone||'<em style="color:var(--muted)">Não cadastrado</em>'}</div>
      </div>
      <div class="fg"><label>Mensagem</label>
        <textarea id="wa-msg" style="min-height:100px;font-size:13px" readonly>${msg}</textarea>
      </div>
      <div style="background:#F0FDF4;border:1px solid #BBF7D0;border-radius:6px;padding:10px 12px;font-size:12px;color:#166534;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span>📎 Para enviar a proposta em anexo, baixe o PDF e envie como arquivo no WhatsApp:</span>
        <button class="btn btn-sm" style="background:#DC2626;color:#fff;border:none" onclick="gerarPDF('${id}')">📥 Baixar PDF</button>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <button class="btn btn-outline btn-sm" onclick="navigator.clipboard.writeText(document.getElementById('wa-msg').value).then(()=>alert('Mensagem copiada!'))">📋 Copiar mensagem</button>
        <a href="${waUrl}" class="btn btn-sm" style="background:#25D366;color:#fff;border:none;text-decoration:none;font-weight:600" target="_blank" rel="noopener">📲 Abrir WhatsApp Web</a>
      </div>
      <p style="font-size:11px;color:var(--muted)">💡 Baixe o PDF → abra o WhatsApp Web → clique em 📎 (anexo) → selecione o PDF → copie a mensagem e envie junto.</p>
    </div>`;

function gerarPDF(id){

  if(!html){ alert('Abra a proposta primeiro clicando em 👁️ visualizar.'); return; }

  // injeta conteúdo num div print-page (visível só no print CSS)
  const old=document.getElementById('_pp');
  if(old) old.remove();
  const div=document.createElement('div');
  div.id='_pp';
  div.className='print-page';
  div.innerHTML=html;
  document.body.appendChild(div);

  // pequena pausa para o DOM renderizar, depois abre diálogo de impressão
  setTimeout(()=>{
    window.print();
    // limpa após o diálogo fechar
    setTimeout(()=>{ const d=document.getElementById('_pp'); if(d)d.remove(); },2000);
  },200);
}

function doImport(e){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(!d.v){alert('Arquivo inválido');return}
      if(!confirm(`Importar backup de ${d.at||'data desconhecida'}?\n\nATENÇÃO: Substituirá os dados de TODOS os usuários na base compartilhada.`))return;
      if(d.clientes) STORE.setClientes(d.clientes);
      if(d.visitas) STORE.setVisitas(d.visitas);
      if(d.propostas) STORE.setPropostas(d.propostas);
      if(d.cfg) STORE.setCfg(d.cfg);
      alert('Importado com sucesso!');
      go(PAGE);
    }catch{alert('Erro ao ler arquivo.')}
  };
  r.readAsText(f);
  e.target.value='';
}

async function buscarCNPJ(){
  const raw=(document.getElementById('c-cnpj')?.value||'').replace(/\D/g,'');
  if(raw.length!==14){ alert('CNPJ inválido. Digite os 14 dígitos.'); return; }
  const st=document.getElementById('cnpj-status');
  if(st) st.innerHTML='<span style="color:var(--info)">🔍 Consultando Receita Federal…</span>';
  try{
    const r=await fetch(`https://brasilapi.com.br/api/cnpj/v1/${raw}`,{signal:AbortSignal.timeout(12000)});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    _aplicarDadosCNPJ(d, raw);
  }catch(e){
    if(st) st.innerHTML='';
    _modalCNPJManual(raw);
  }
}

function _aplicarDadosCNPJ(d, raw){
  const fmt=n=>(n||'').replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,'$1.$2.$3/$4-$5');
  const up=v=>(v||'').toUpperCase().trim();
  const s=id=>document.getElementById(id);
  const set=(id,val)=>{if(s(id))s(id).value=val};

  // monta endereço completo: tipo + logradouro + nº (complemento separado)
  const tipoEnd=up(d.tipo_logradouro);
  const logr=[tipoEnd, up(d.logradouro)].filter(Boolean).join(' ');
  const endCompleto=[logr, d.numero].filter(Boolean).join(', ');

  // telefone: ddd_telefone_1 vem como "2138823943" (10 ou 11 dígitos)
  const fmtTel=t=>{
    if(!t) return '';
    const n=t.replace(/\D/g,'');
    if(n.length===10) return `(${n.slice(0,2)}) ${n.slice(2,6)}-${n.slice(6)}`;
    if(n.length===11) return `(${n.slice(0,2)}) ${n.slice(2,7)}-${n.slice(7)}`;
    return t;
  };

  set('c-cnpj',    fmt(raw));
  set('c-razao',   up(d.razao_social));
  set('c-fantasia', d.nome_fantasia||'');
  set('c-email',   (d.email||'').toLowerCase());
  set('c-tel',     fmtTel(d.ddd_telefone_1||d.ddd_fax||''));
  set('c-end',     endCompleto.toUpperCase());
  set('c-bairro',  up(d.bairro));
  set('c-cidade',  up(d.municipio));
  set('c-cep',     (d.cep||'').replace(/^(\d{5})(\d{3})$/,'$1-$2'));
  set('c-uf',      up(d.uf));

  // complemento no campo observações se existir
  const comp=up(d.complemento);
  if(comp){ const ob=s('c-obs'); if(ob&&!ob.value) ob.value='Compl.: '+comp; }

  const st=document.getElementById('cnpj-status');
  const sit=up(d.descricao_situacao_cadastral)||'';
  const porte=d.porte||'';
  const cor=sit.includes('ATIVA')?'var(--ok)':'var(--warn)';
  if(st) st.innerHTML=`<span style="color:${cor}">✅ ${sit||'Preenchido'}${porte?' · '+porte:''}</span>`;
}

  const XLSX=window.XLSX;
  const wb=XLSX.utils.book_new();

  const cliData=STORE.clientes().map(c=>({
    'Razão Social':c.razaoSocial||'','CNPJ':c.cnpj||'','Nome Fantasia':c.nomeFantasia||'',

    'Insc. Estadual':c.ie||'','Insc. Municipal':c.im||'','Obs':c.observacoes||'',
    'Dt. Cadastro':c.dataCadastro||''
  }));

  const cliMap=new Map(STORE.clientes().map(c=>[c.id,c.razaoSocial]));
  const visData=STORE.visitas().map(v=>({
    'Data':v.data||'','Cliente':cliMap.get(v.clienteId)||v.clienteId||'',
    'Tipo':v.tipo||'','Responsável':v.responsavel||'',
    'Observações':v.observacoes||'','Próx. Contato':v.proximoContato||''
  }));

  const propData=STORE.propostas().map(p=>{
    const c=STORE.clientes().find(x=>x.id===p.clienteId)||{};
    const cat=(CATS[p.cat||'locacao']||CATS.locacao).label;
    const st=(STATUS[p.status||'rascunho']||STATUS.rascunho).label;
    return {
      'Número':nrFmt(p),'Categoria':cat,'Status':st,
      'Cliente':c.razaoSocial||'','Segmento':c.segmento||'',
      'Vendedor':p.vendedorIdx?(STORE.cfg()['resp'+p.vendedorIdx+'Nome']||''):'',
      'Equipamento':p.tipoEquip||'','Qtd':p.quantidade||1,
      'Valor Mensal':parseFloat(p.valorMensal)||0,'Valor Total':parseFloat(p.valorTotal)||0,
      'Dt. Emissão':p.dataCriacao||'','Revisão':p.revisao||0,
      'Validade (dias)':p.validadeDias||10
    };
  });

  if(tipo==='clientes'||tipo==='consolidado'){
    const ws=XLSX.utils.json_to_sheet(cliData.length?cliData:[{'Razão Social':'(sem dados)'}]);
    XLSX.utils.book_append_sheet(wb,ws,'Clientes');
  }
  if(tipo==='visitas'||tipo==='consolidado'){
    const ws=XLSX.utils.json_to_sheet(visData.length?visData:[{'Data':'(sem dados)'}]);
    XLSX.utils.book_append_sheet(wb,ws,'Visitas');
  }
  if(tipo==='propostas'||tipo==='consolidado'){
    const ws=XLSX.utils.json_to_sheet(propData.length?propData:[{'Número':'(sem dados)'}]);
    XLSX.utils.book_append_sheet(wb,ws,'Propostas');
  }

  const filename=`CRM-FF-${tipo}-${today()}.xlsx`;
  XLSX.writeFile(wb,filename);
  if(st) st.textContent=`✅ Download iniciado: "${filename}"`;
}

// ═══════════════════════════════════════════════
// INIT — Firebase Firestore (multi-conta, multi-computador)
// ═══════════════════════════════════════════════
function _navLock(on){
  const nav=document.getElementById('nav');
  if(!nav)return;
  nav.style.pointerEvents=on?'none':'';
  nav.style.opacity=on?'0.4':'';
}

function _modoLocal(msg){
  STATE.clientes=LS.g('clientes')||[];
  STATE.visitas=LS.g('visitas')||[];
  STATE.propostas=LS.g('propostas')||[];
  STATE.cfg=LS.g('cfg');
  _applySidebarLogo(STATE.cfg);
  const foot=document.getElementById('side-foot');
  if(foot) foot.innerHTML=`v1.0 · 2026 · <span style="color:#F59E0B" title="${msg}">⚠️ local</span>`;
  _navLock(false);
  go('dashboard');
}

function initDB(){
  // Verifica se scripts do Firebase carregaram
  if(typeof firebase === 'undefined' || window._fbErr){
    const motivo = window._fbErr
      ? `Erro ao carregar script: ${window._fbErr}`
      : 'Firebase SDK não carregou';
    console.warn('[CRM]', motivo, '— usando modo local');
    _modoLocal(motivo + ' — dados locais apenas');
    return;
  }
  // Verifica se config foi preenchida
  if(FIREBASE_CONFIG.apiKey.startsWith('COLE_')){
    _modoLocal('Firebase não configurado — dados locais apenas');
    return;
  }

  _navLock(true);
  document.getElementById('content').innerHTML=
    '<div style="display:flex;align-items:center;justify-content:center;height:300px;flex-direction:column;gap:14px">'+
    '<div style="font-size:42px">⏳</div>'+
    '<p style="color:var(--muted);font-size:14px">Conectando ao banco de dados…</p></div>';

  let app;
  try{
    app=firebase.initializeApp(FIREBASE_CONFIG);
  }catch(e){
    // já inicializado (hot-reload)
    app=firebase.app();
  }
  const db=app.firestore();
  STATE._db=db;

  const foot=document.getElementById('side-foot');
  if(foot) foot.innerHTML='v1.0 · 2026 · <span style="color:#4ade80">🔗 Firebase</span>';

  let n=0;
  const onReady=()=>{
    if(++n===4){
      // Migração: se Firebase vazio mas localStorage tem dados, migra automaticamente
      const lsClis=LS.g('clientes')||[];
      const lsVis=LS.g('visitas')||[];
      const lsProps=LS.g('propostas')||[];
      const lsCfg=LS.g('cfg');
      if(STATE.clientes.length===0 && lsClis.length>0){
        if(confirm(`Encontramos ${lsClis.length} cliente(s) salvos localmente.\nMigrar para a nuvem agora?`)){
          STORE.setClientes(lsClis);
          STORE.setVisitas(lsVis);
          STORE.setPropostas(lsProps);
          if(lsCfg) STORE.setCfg(lsCfg);
          try{['clientes','visitas','propostas','cfg'].forEach(k=>localStorage.removeItem('crm_'+k));}catch{}
        }
      }
      _navLock(false);
      go('dashboard');
    }
  };
  let ic=false,iv=false,ip=false,icfg=false;

  db.collection('clientes').onSnapshot(snap=>{
    STATE.clientes=snap.docs.map(d=>d.data());
    if(!ic){ic=true;onReady();}
    else if(PAGE==='clientes') renderClientes();
    else if(PAGE==='dashboard') renderDash();
  },err=>{console.error('clientes',err);if(!ic){ic=true;onReady();}});

  db.collection('visitas').onSnapshot(snap=>{
    STATE.visitas=snap.docs.map(d=>d.data());
    if(!iv){iv=true;onReady();}
    else if(PAGE==='visitas') renderVisitas();
    else if(PAGE==='dashboard') renderDash();
  },err=>{console.error('visitas',err);if(!iv){iv=true;onReady();}});

  db.collection('propostas').onSnapshot(snap=>{
    STATE.propostas=snap.docs.map(d=>d.data());
    if(!ip){ip=true;onReady();}
    else if(PAGE==='propostas') renderPropostas();
    else if(PAGE==='dashboard') renderDash();
  },err=>{console.error('propostas',err);if(!ip){ip=true;onReady();}});

  db.collection('cfg').doc('main').onSnapshot(snap=>{
    STATE.cfg=snap.exists?snap.data():null;
    _applySidebarLogo(STATE.cfg);
    if(!icfg){icfg=true;onReady();}
  },err=>{console.error('cfg',err);if(!icfg){icfg=true;onReady();}});
}

// ═══════════════════════════════════════════════
// ENTER — pula para o próximo campo
// ═══════════════════════════════════════════════
function _setupEnterNav(){
  document.addEventListener('keydown', function(e){
    if(e.key!=='Enter') return;
    const tag=e.target.tagName;
    // só inputs e selects dentro de modal ou formulário
    if(tag==='TEXTAREA') return;
    if(tag!=='INPUT' && tag!=='SELECT') return;
    e.preventDefault();
    // coleta todos os campos focáveis no container atual
    const container=e.target.closest('.overlay,.modal,#content')||document;
    const fields=Array.from(container.querySelectorAll(
      'input:not([disabled]):not([hidden]):not([type="file"]):not([type="checkbox"]),select:not([disabled]),textarea:not([disabled])'
    )).filter(el=>{
      const s=window.getComputedStyle(el);
      return s.display!=='none'&&s.visibility!=='hidden'&&el.offsetParent!==null;
    });
    const idx=fields.indexOf(e.target);
    if(idx>=0 && idx<fields.length-1){
      fields[idx+1].focus();
      if(fields[idx+1].tagName==='INPUT') fields[idx+1].select();
    }
  });
}
_setupEnterNav();

// Garante que o DOM e os scripts externos estejam prontos
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', initDB);
} else {
  initDB();
}
</script>
